<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>KRATT</title>
    <link rel="icon" type="image/svg+xml" href="/kratt.svg" />
    <style>
      html {
        font-size: 14px;
        color-scheme: dark;
      }

      /* Instant dark theme - prevents white screen flash on startup */
      html, body, #root {
        margin: 0;
        padding: 0;
        background-color: #0e0e0e; /* Ember ground */
        color: #ece8e3; /* Ember text */
      }

      /* Loading skeleton - shows while React initializes */
      #root:empty::before {
        content: '';
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #0e0e0e;
      }

      /* Loading indicator */
      #root:empty::after {
        content: '';
        width: 72px;
        height: 64px;
        background: url('/kratt.svg') center / contain no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 32px;
        font-weight: 700;
        color: #ff8a3d; /* Ember accent */
        letter-spacing: -0.02em;

      }

    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
