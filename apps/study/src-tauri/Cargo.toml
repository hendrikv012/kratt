[package]
name = "kratt"
version = "1.3.3"
description = "Kratt, the study app, as a desktop app"
authors = ["caesarsta"]
repository = "https://github.com/hendrikv012/kratt"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kratt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.4.1", features = [] }

[dependencies]
tauri = { version = "~2.8.5", features = [] }
tauri-plugin-fs = "~2.4.2"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
url = "2.5"
urlencoding = "2.1.3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
zip = "2.4"
uuid = { version = "1.0", features = ["v4"] }

serde_json = "1.0"
fs2 = "0.4.3"
open = "=5.3.3"

[dev-dependencies]
tempfile = "3.8"

