<!doctype html>
<html lang="en" data-ember="dark">
<head><meta charset="utf-8"><title>Kratt Ember artwork</title>
<link rel="stylesheet" href="../../site/ember.css"><link rel="stylesheet" href="../../site/styles.css">
<style>
body { width:1200px; height:630px; overflow:hidden; }
.brand-artwork { height:630px; padding:56px; display:grid; grid-template-columns:470px 1fr; gap:36px; align-items:center; }
.artwork-wordmark { display:flex; align-items:center; gap:18px; margin-bottom:44px; font:500 40px/1 var(--ui); letter-spacing:.04em; }
.artwork-wordmark img { width:72px; height:64px; }
.brand-artwork h1 { font-size:62px; line-height:1.05; max-width:12ch; margin-bottom:24px; }
.brand-artwork p { max-width:31ch; color:var(--st-text-body); font:20px/1.6 var(--reading); }
.artwork-address { margin-top:32px; color:var(--st-accent); font:500 20px var(--ui); }
.artwork-workspace { width:740px; border:1px solid var(--st-line); border-radius:6px; background:var(--st-surface); overflow:hidden; }
.artwork-workspace img { width:740px; max-width:none; }
</style></head>
<body><main class="brand-artwork">
<div><div class="artwork-wordmark"><img src="../../site/assets/kratt.svg" alt="">Kratt</div><h1>Your notes, with a study partner.</h1><p>Connected ideas. Local AI.<br>Study materials made from your notes.</p><div class="artwork-address">hendrikv012.github.io/kratt</div></div>
<div class="artwork-workspace"><img src="../../site/assets/ember-notes.png" alt="Kratt’s Ember workspace with example biology notes"></div>
</main></body></html>
