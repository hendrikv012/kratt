<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -6 72 58" width="288" height="232" shape-rendering="crispEdges" role="img" aria-labelledby="t">
<title id="t">Kratt</title>
<style>


.kratt{fill:#ff8a3d}
.kratt .k-lids{opacity:0;animation:k-blink 4.6s steps(1) infinite}
.kratt .k-tl{animation:k-tuft 3.2s steps(1) infinite}
.kratt .k-tr{animation:k-tuft 3.2s steps(1) .25s infinite}
.kratt .k-fork{animation:k-fork 5.4s steps(1) infinite}
.kratt .k-z{display:none}
.kratt.think .k-fork{animation:k-poke .5s steps(2) infinite}
.kratt.think .k-tl{animation:k-tuft-fast .5s steps(2) infinite}
.kratt.think .k-tr{animation:k-tuft-fast .5s steps(2) .25s infinite}
.kratt.hop .k-hop,.hopper:hover .kratt .k-hop{animation:k-hop .6s steps(2) infinite}
.kratt.sleep .k-lids{opacity:1;animation:none}
.kratt.sleep .k-fork,.kratt.sleep .k-tl,.kratt.sleep .k-tr{animation:none}
.kratt.sleep .k-fork{transform:translate(2px,6px)}
.kratt.sleep .k-z{display:inline;animation:k-z 2.4s steps(4) infinite}
@keyframes k-blink{0%,92%{opacity:0}93%,96%{opacity:1}97%,100%{opacity:0}}
@keyframes k-tuft{0%,72%{transform:none}76%,84%{transform:translateY(-2px)}88%,100%{transform:none}}
@keyframes k-tuft-fast{0%{transform:none}50%{transform:translateY(-2px)}}
@keyframes k-fork{0%,60%{transform:none}64%,74%{transform:translateY(-2px)}78%,100%{transform:none}}
@keyframes k-poke{0%{transform:none}50%{transform:translateY(-3px)}}
@keyframes k-hop{0%{transform:none}50%{transform:translateY(-4px)}}
@keyframes k-z{0%{transform:none;opacity:1}100%{transform:translate(4px,-8px);opacity:0}}
@media (prefers-reduced-motion:reduce){.kratt *{animation:none!important}}

</style>
<g class="kratt"><g class="k-hop"><rect class="k-tl" x="18" y="6" width="4" height="14"></rect><rect class="k-tr" x="42" y="10" width="4" height="10"></rect><path class="k-body" d="M12 18h40v18h-40z M22 26v8h6v-8z M36 26v8h6v-8z M12 38h40v4h-40z M6 30h8v4h-8z M6 30h4v14h-4z M4 42h8v8h-8z M20 40h4v10h-4z M40 40h4v10h-4z"></path><path class="k-fork" d="M50 30h10v4h-10z M56 0h4v34h-4z M50 8h16v4h-16z M50 0h4v10h-4z M62 0h4v10h-4z"></path><g class="k-lids"><rect x="22" y="26" width="6" height="8"></rect><rect x="36" y="26" width="6" height="8"></rect></g><g class="k-z"><path d="M58 -6h6v2h-2v2h-2v2h4v2h-6v-2h2v-2h2v-2h-4z"></path></g></g></g>
</svg>
